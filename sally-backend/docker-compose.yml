services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.33.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
      - --read-timeout=30s
      - --write-timeout=30s
    ports:
      - "8080:8080"
      - "50051:50051"
      - "2112:2112"
    restart: on-failure
    environment:
      # Basic settings
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      ENABLE_API_BASED_MODULES: 'true'

      # ✅ FIX: Single-node configuration
      CLUSTER_HOSTNAME: 'node1'
      DEFAULT_VECTORIZER_MODULE: 'text2vec-openai'
      ENABLE_MODULES: 'text2vec-openai'

      # OpenAI settings
      OPENAI_APIKEY: ${Embedder_API_KEY}
      OPENAI_BASE_URL: ${Embedder_OPENAI_BASE_URL}

      # ✅ FIX: Disable replication for single-node
      REPLICATION_FACTOR: '1'
      ENABLE_REPLICATION: 'false'

      # ✅ Enhanced Persistence settings for data durability
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      PERSISTENCE_FLUSH_IDLE_MEMTABLES_AFTER: '10'
      PERSISTENCE_MAX_SSTABLE_SIZE_FOR_MERGE: '10485760'
      PERSISTENCE_LSM_ACCESS_STRATEGY: 'mmap'
      PERSISTENCE_INVERTED_INDEX_CONFIG_MAXIMUM_CHUNK_SIZE: '10485760'

      # ✅ Backup and recovery settings
      BACKUP_FILESYSTEM_PATH: '/var/lib/weaviate/backups'

      # ✅ Memory management for better performance
      QUERY_MAXIMUM_RESULTS: 10000
      MEMORY_PRESSURE_THRESHOLD: '0.85'

      # ✅ Disable telemetry and set log level
      DISABLE_TELEMETRY: 'true'
      LOG_LEVEL: 'info'

      # Enable Prometheus monitoring
      PROMETHEUS_MONITORING_ENABLED: 'true'
    volumes:
      - ./weaviate_data:/var/lib/weaviate
    networks:
      - sallybot-network   
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s    



networks:
  sallybot-network:
    driver: bridge