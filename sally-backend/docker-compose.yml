services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.33.0
    command:
      - --host
      - 0.0.0.0
      - --port
      - '8080'
      - --scheme
      - http
    ports:
      - "8080:8080"
      - "50051:50051"
    restart: on-failure:0
    environment:
      # Basic settings
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      ENABLE_API_BASED_MODULES: 'true'
      CLUSTER_HOSTNAME: 'node1'

      # OpenAI settings
      OPENAI_APIKEY: ${Embedder_API_KEY}
      OPENAI_BASE_URL: ${Embedder_OPENAI_BASE_URL}
      REPLICATION_FACTOR: '1'

      # Optional: Ollama settings (if needed)
      # OLLAMA_URL: ${OLLAMA_URL}

      # Optional: Disable telemetry and set log level
      DISABLE_TELEMETRY: 'true'
      LOG_LEVEL: 'info'
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  weaviate_data:
